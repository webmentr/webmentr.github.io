<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="max-image-preview:large">
<title>WebMentr Blog | Web Design, SEO & Digital Growth Guides</title>
<meta name="description"
content="Read WebMentr blog for practical guides about web design, SEO, website performance and digital business growth.">
<link rel="canonical" href="https://webmentr.com/blog/">

<!-- Open Graph -->
<meta property="og:type" content="website">
<meta property="og:title" content="WebMentr Blog | Web Design & SEO Guides">
<meta property="og:description" content="Guides and insights about web design, SEO and online business growth.">
<meta property="og:image" content="https://webmentr.com/assets/images/blog-preview.png">
<meta property="og:url" content="https://webmentr.com/blog/">

<!-- Twitter Card -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="WebMentr Blog | Web Design & SEO Guides">
<meta name="twitter:description" content="Guides and insights about web design, SEO and digital business growth.">
<meta name="twitter:image" content="https://webmentr.com/assets/images/blog-preview.png">

<!-- CollectionPage Schema -->
<script type="application/ld+json">
{
"@context":"https://schema.org",
"@type":"CollectionPage",
"name":"WebMentr Blog",
"url":"https://webmentr.com/blog/",
"description":"WebMentr blog articles about web design, SEO and digital growth."
}
</script>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<!-- Font Awesome -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<!-- Custom CSS -->
<link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>
<div id="header"></div>

<main>
<!-- Breadcrumb -->
<nav aria-label="breadcrumb" class="container mt-3">
<ol class="breadcrumb">
<li class="breadcrumb-item"><a href="/">Home</a></li>
<li class="breadcrumb-item active">Blog</li>
</ol>
</nav>

<section class="py-5">
<div class="container">
<h1 class="fw-bold mb-3">
Web Design & Development Blog
</h1>
<p class="text-muted mb-5">
Guides, tutorials and insights about web design, SEO,
website performance and growing your business online.
</p>

<!-- Search + Filter -->
<div class="row mb-4">
<div class="col-md-6">
<input
type="text"
id="search-input"
class="form-control"
placeholder="Search blog articles...">
</div>

<div class="col-md-6">
<select id="category-filter" class="form-select">
<option value="all">All Categories</option>
<option value="Web Design">Web Design</option>
<option value="SEO">SEO</option>
<option value="Business">Business</option>
</select>
</div>
</div>

<div class="row">
<!-- Blog List -->
<div class="col-lg-8">
<div class="row" id="blog-list"></div>

<nav class="mt-4">
<ul class="pagination justify-content-center" id="pagination"></ul>
</nav>
</div>

<!-- Sidebar -->
<div class="col-lg-4">
<div class="card p-3 mb-4 shadow-sm">
<h5 class="fw-bold">
<i class="fa fa-newspaper"></i> Recent Articles
</h5>
<ul class="list-unstyled" id="recent-posts"></ul>
</div>
</div>
</div>
</div>
</section>
</main>

<div id="footer"></div>

<script src="/assets/js/include.js"></script>
<script src="/assets/js/blog.js"></script>
<script src="/assets/js/recent-posts.js"></script>
</body>
</html>
