<script>
const form = document.getElementById("contact-form");
const status = document.getElementById("form-status");
form.addEventListener("submit", async function(e){
e.preventDefault();
status.innerHTML =
"<div class='alert alert-info'>Sending message...</div>";
const formData = new FormData(form);
try{
const response = await fetch(
"https://script.google.com/macros/s/AKfycbz4CD6ZCklEqubPncABnixAelST1RQm1pn87r57279zuxPHsiEgJiRaFesWAOarJJBnGw/exec",
{
method:"POST",
body:formData
});
status.innerHTML =
"<div class='alert alert-success'>✅ Message sent successfully! We will contact you soon.</div>";
form.reset();
}catch(err){
status.innerHTML =
"<div class='alert alert-danger'>❌ Failed to send message.</div>";
}
});
</script>
