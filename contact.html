<body>

<div id="header"></div>


<!-- PAGE HEADER -->

<div class="container">

<h1 class="fw-bold">Contact Us</h1>

<p class="text-muted">
Let’s discuss your project and build something amazing together.
</p>

</div>

</section>


<!-- CONTACT SECTION -->
<section class="py-5">

<div class="container">

<div class="row g-5">

<!-- CONTACT INFO -->
<div class="col-lg-4">

<div class="card border-0 shadow-sm p-4">

<h4 class="fw-bold mb-4">Get in Touch</h4>

<p class="mb-3">
<i class="fa fa-envelope text-primary me-2"></i>
<a href="mailto:webmentr@gmail.com">webmentr@gmail.com</a>
</p>

<p class="mb-3">
<i class="fa fa-phone text-primary me-2"></i>
+880-1712709909
</p>

<p class="mb-3">
<i class="fa fa-location-dot text-primary me-2"></i>
Bangladesh
</p>

<p class="mb-0">
<i class="fab fa-whatsapp text-success me-2"></i>
<a href="https://wa.me/8801712709909" target="_blank">Chat on WhatsApp</a>
</p>

</div>

</div>


<!-- CONTACT FORM -->
<div class="col-lg-8">

<div class="card border-0 shadow-sm p-4">

<h4 class="fw-bold mb-4">Send a Message</h4>

<form id="contact-form" class="card p-4 shadow-sm">

<div class="row">

<div class="col-md-6 mb-3">
<input type="text" name="name" class="form-control" placeholder="Your Name" required>
</div>

<div class="col-md-6 mb-3">
<input type="email" name="email" class="form-control" placeholder="Your Email" required>
</div>

</div>

<div class="mb-3">
<input type="text" name="subject" class="form-control" placeholder="Subject">
</div>

<div class="mb-3">
<textarea name="message" rows="5" class="form-control" placeholder="Your Message" required></textarea>
</div>

<button type="submit" class="btn btn-primary px-4">
Send Message
</button>

<div id="form-status" class="mt-3"></div>

</form>

</div>

</div>

</div>

</div>

</section>
<section class="py-5 bg-light">

<div class="container">

<h2 class="fw-bold text-center mb-4">
Request a Free Website Consultation
</h2>

<form action="https://formspree.io/f/xwvngrnp" method="POST">

<div class="row">

<div class="col-md-6 mb-3">
<input type="text" name="name" class="form-control" placeholder="Your Name" required>
</div>

<div class="col-md-6 mb-3">
<input type="email" name="email" class="form-control" placeholder="Your Email" required>
</div>

</div>

<div class="mb-3">
<textarea name="message" class="form-control" rows="4" placeholder="Tell us about your project"></textarea>
</div>

<button class="btn btn-primary">
Request Consultation
</button>

</form>

</div>

</section>

<div id="footer"></div>

<script src="assets/js/include.js"></script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>
const form = document.getElementById("contact-form");
const status = document.getElementById("form-status");

form.addEventListener("submit", async function(e) {
e.preventDefault();

const data = new FormData(form);

try {
const response = await fetch("https://formspree.io/f/xwvngrnp", {
method: "POST",
body: data,
headers: {
'Accept': 'application/json'
}
});

if (response.ok) {
status.innerHTML = "<div class='alert alert-success'>✅ Message sent successfully! We will contact you soon.</div>";
form.reset();
} else {
status.innerHTML = "<div class='alert alert-danger'>❌ Something went wrong. Please try again.</div>";
}

} catch (error) {
status.innerHTML = "<div class='alert alert-danger'>❌ Network error. Please try later.</div>";
}
});
</script>
</body>
